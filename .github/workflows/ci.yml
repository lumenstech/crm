name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, release]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  check:
    name: check-types, lint, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm_test?schema=public
      ALLOWED_SIGN_IN: example.com
      BETTER_AUTH_SECRET: ci-only-secret-regenerate-for-any-real-deployment
      API_URL: http://localhost:3001
      APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-only-google-client-id
      GOOGLE_CLIENT_SECRET: ci-only-google-client-secret

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Apply PR42 Biome safe fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/comp-crm-complete-ingest-flow'
        run: |
          bunx biome check --write apps/api apps/app packages/db
          (cd apps/mcp && bunx biome check --write .)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api apps/app apps/mcp packages/db
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply PR42 Biome safe fixes"
            git push --no-verify origin HEAD:fix/comp-crm-complete-ingest-flow
          fi

      - name: Apply migrations
        run: bun run db:deploy

      - run: bun run check-types

      - run: bun run lint

      - run: bun run lint:slop

      - run: bun run test
