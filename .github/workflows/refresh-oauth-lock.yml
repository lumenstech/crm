name: Refresh OAuth lock

on:
  push:
    branches:
      - fix/comp-crm-claude-oauth

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --lockfile-only
      - name: Commit generated lock
        run: |
          if git diff --quiet -- bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "fix(auth): regenerate Better Auth lock [skip ci]"
          git push origin HEAD:fix/comp-crm-claude-oauth
