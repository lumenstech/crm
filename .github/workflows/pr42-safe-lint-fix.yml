name: PR42 Safe Lint Fix

on:
  push:
    branches:
      - fix/comp-crm-complete-ingest-flow

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm_test?schema=public
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/comp-crm-complete-ingest-flow

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Fix DB workspace
        run: |
          cd packages/db
          bunx biome check --write .

      - name: Fix API workspace
        run: |
          cd apps/api
          bunx biome check --write .

      - name: Fix App workspace
        run: |
          cd apps/app
          bunx biome check --write .

      - name: Fix MCP workspace
        run: |
          cd apps/mcp
          bunx biome check --write .

      - name: Commit safe fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db apps/api apps/app apps/mcp
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply Biome safe fixes"
            git push --no-verify origin HEAD:fix/comp-crm-complete-ingest-flow
          fi
